[project]
name = "investment-dd-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
investment-dd = "due_diligence_agent.presentation.cli:main"
investment-dd-api = "due_diligence_agent.presentation.api.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/due_diligence_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-10k.html" = "due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-10k.html"
"src/due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-10q.html" = "due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-10q.html"
"src/due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-xbrl.xml" = "due_diligence_agent/fixtures/public_us_frozen_v1/sec/aapl-2026-xbrl.xml"
"src/due_diligence_agent/fixtures/startup_market_research_v1/manifest.json" = "due_diligence_agent/fixtures/startup_market_research_v1/manifest.json"
"src/due_diligence_agent/fixtures/startup_market_research_v1/sources/competitors.json" = "due_diligence_agent/fixtures/startup_market_research_v1/sources/competitors.json"
"src/due_diligence_agent/fixtures/startup_market_research_v1/sources/news.json" = "due_diligence_agent/fixtures/startup_market_research_v1/sources/news.json"

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
core = [
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2.2,<2",
  "httpx>=0.28.1,<1",
  "tenacity>=9.1.4,<10",
]
workflow = ["langgraph>=1.2.9,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]
llm-openai = ["openai>=2.38,<3"]
observability-local = [
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
observability-langsmith = ["langsmith>=0.10,<0.11"]
stage1a-data = ["pandas>=3.0.3,<3.1,!=3.0.4", "duckdb>=1.5.4,<1.6", "beautifulsoup4>=4.15,<5"]
stage1a-ui-report = [
  "streamlit>=1.60,<2",
  "jinja2>=3.1,<4",
  "weasyprint>=69,<70",
  "matplotlib>=3.11,<3.12",
  "plotly>=6.9,<7",
]
stage1a-rag-local = ["sentence-transformers>=5.6,<6", "faiss-cpu>=1.14,<2"]
stage1a-market-yfinance-demo = ["yfinance>=1.5,<2"]
reportlab-fallback = ["reportlab>=5,<6"]
eval-ragas = ["ragas>=0.4.3,<0.5"]
founder-api = [
    "fastapi>=0.137,<0.138",
    "uvicorn>=0.52,<0.53",
]
stage1a = [
  { include-group = "core" },
  { include-group = "workflow" },
  { include-group = "llm-openai" },
  { include-group = "observability-local" },
  { include-group = "stage1a-data" },
  { include-group = "stage1a-ui-report" },
  { include-group = "reportlab-fallback" },
]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.1,<8",
  "respx>=0.22,<1",
  "ruff>=0.15.22,<0.16",
  "mypy>=2.3,<3",
  "pypdf>=6.4,<7",
]
stage1b-light-ingest = [
  { include-group = "stage1a" },
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.2,<2",
  "pymupdf>=1.27,<2",
  "pdfplumber>=0.11.10,<0.12",
  "pillow>=12.3,<13",
]
stage1b-ocr-tesseract = ["pytesseract>=0.3.13,<0.4"]
stage1b-redaction-presidio = [
  "presidio-analyzer>=2.2.364,<2.3",
  "presidio-anonymizer>=2.2.364,<2.3",
]
stage1b-docling = ["docling>=2.115,<3"]
stage1b = [
  { include-group = "stage1b-light-ingest" },
  { include-group = "stage1a-rag-local" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["due_diligence_agent"]
